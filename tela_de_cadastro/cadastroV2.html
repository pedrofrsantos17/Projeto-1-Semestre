<!DOCTYPE html>
<html lang="pt">
    

<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="id-card-solid-full.svg">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <title>Cadastro</title>
</head>

<body>
    <div class="card" id="div_cadastro">
        <h2>Cadastro</h2>

        <div class="campo">
            <span class="icone">👤</span>
            <input type="text" id="ipt_nome_usuario" placeholder="Nome de usuário">
        </div>

        <div class="campo">
            <span class="icone">✉️</span>
            <input type="text" id="ipt_email" placeholder="Email">
        </div>

        <div class="campo">
            <span class="icone">🔒</span>
            <input type="password" id="ipt_senha" placeholder="Senha">
        </div>

        <div class="campo">
            <span class="icone">🪪</span>
            <input type="text" id="ipt_cpf" placeholder="CPF(somente números)">


        </div>

        <button onclick="AGA()">Cadastrar</button>
    </div>

    <div class="card" id="div_opcoes" style="display: none;">
        <h2>Empresa</h2>
        <span style="color: #F3EBD3;">Agora, associe-se a uma empresa</span>
        <button onclick="MostrarEntrar()">Entrar em uma empresa</button>
        <button onclick="MostrarCriar()">Criar uma empresa</button>
    </div>

    <div class="card" id="div_entrar" style="display: none;">
        <h2>Entrar</h2>

        <div class="campo">
            <span class="icone">🏢</span>
            <input type="text" id="ipt_codigo_cadastro" placeholder="Código de cadastro da empresa">
        </div>

        <div class="campo">
            <span class="icone">✉️</span>
            <input type="text" id="ipt_email_empresarial" placeholder="Email empresarial">
        </div>

        <button onclick="EntrarEmpresa()">Entrar</button>
    </div>

    <div class="card" id="div_criar" style="display: none;">
        <h2>Cadastrar</h2>

        <div class="campo">
            <span class="icone">🏢</span>
            <input type="text" id="ipt_nome_empresa" placeholder="Nome da empresa">
        </div>

        <div class="campo">
            <span class="icone">📄</span>
            <input type="text" id="ipt_cnpj_empresa" placeholder="CNPJ da empresa">
        </div>

        <div class="campo">
            <span class="icone">✉️</span>
            <input type="text" id="ipt_email_base" placeholder="Base do email (ex: valeverdevinhos.com)">
        </div>

        <button onclick="CriarEmpresa()">Criar empresa</button>
    </div>

    <div class="card" id="div_exibir" style="display: none;">
        <h2>Pronto!</h2>
        <span id="exibir" style="color: #F3EBD3;"></span>
    </div>

</body>
<script>
  let dados = {};

  function AGA() {
    let nome_usuario = ipt_nome_usuario.value;
    let email = ipt_email.value;
    let senha = ipt_senha.value;
    let cpf = ipt_cpf.value.replace(/\D/g, ""); // string só com números (CHAR(11))

    if (nome_usuario == "" || email == "" || senha == "" || cpf == "") {
      alert(`Preencha nome, email, senha e CPF`);
    } else if (cpf.length != 11) {
      alert(`CPF precisa ter 11 dígitos`);
    } else {
      dados = { nome: nome_usuario, email: email, senha: senha, cpf: cpf };
      div_cadastro.style.display = "none";
      div_opcoes.style.display = "flex";
    }
  }

  function MostrarEntrar() {
    div_opcoes.style.display = "none";
    div_entrar.style.display = "flex";
    div_criar.style.display = "none";
  }

  function MostrarCriar() {
    div_opcoes.style.display = "none";
    div_criar.style.display = "flex";
    div_entrar.style.display = "none";
  }

  function cadastrarUsuario(codigo, aoTerminar) {
    fetch("http://localhost:3333/usuarios/cadastrar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        nomeServer: dados.nome,
        emailServer: dados.email,
        senhaServer: dados.senha,
        cpfServer: dados.cpf,
        codigoCadastroServer: codigo
      })
    })
      .then(function (resposta) {
        if (resposta.ok) {
          aoTerminar();
        } else {
          resposta.text().then(function (texto) {
            alert(texto);
          });
        }
      })
      .catch(function (erro) {
        console.log(erro);
        alert("Não foi possível falar com a API. Ela está rodando?");
      });
  }

  function EntrarEmpresa() {
    let codigo = ipt_codigo_cadastro.value;

    if (codigo == "") {
      alert(`Preencha o código da empresa`);
      return;
    }

    cadastrarUsuario(codigo, function () {
      div_entrar.style.display = "none";
      div_exibir.style.display = "flex";
      exibir.innerHTML = `${dados.nome} agora faz parte da empresa!`;
    });
  }

  function CriarEmpresa() {
    let nome_empresa = ipt_nome_empresa.value;
    let cnpj_empresa = ipt_cnpj_empresa.value;

    if (nome_empresa == "" || cnpj_empresa == "") {
      alert(`Preencha nome e CNPJ da empresa`);
      return;
    }

    fetch("http://localhost:3333/empresas/cadastrar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nomeServer: nome_empresa, cnpjServer: cnpj_empresa })
    })
      .then(function (resposta) {
        if (resposta.ok) {
          resposta.json().then(function (json) {
            cadastrarUsuario(json.codigoCadastro, function () {
              div_criar.style.display = "none";
              div_exibir.style.display = "flex";
              exibir.innerHTML = `Empresa ${nome_empresa} criada!<br>`;
              exibir.innerHTML += `Código para os funcionários entrarem: <b>${json.codigoCadastro}</b>`;
            });
          });
        } else {
          resposta.text().then(function (texto) {
            alert(texto);
          });
        }
      })
      .catch(function (erro) {
        console.log(erro);
        alert("Não foi possível falar com a API. Ela está rodando?");
      });
  }
</script>

</html>
