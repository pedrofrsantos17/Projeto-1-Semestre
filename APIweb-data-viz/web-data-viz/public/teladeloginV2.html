<!DOCTYPE html>
<html lang="pt">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  <title>Login</title>
</head>

<body>
<div class="card" id="div_login">
  <h2>Login</h2>

  <div class="campo">
    <span class="icone">👤</span>
    <input type="text" id="ipt_email" placeholder="Email">
  </div>

  <div class="campo">
    <span class="icone">🔒</span>
    <input type="password" id="ipt_senha" placeholder="Senha">
  </div>
  <button onclick="entrar()">Entrar</button>

</div>

<div class="card" id="div_exibir" style="display: none;">
  <h2>Bem-vindo!</h2>
  <span id="exibir" style="color: #F3EBD3;"></span>
</div>
</body>
<script>
  // Função de login real: envia os dados ao endpoint /usuarios/autenticar
  async function entrar() {
    const email = (document.getElementById('ipt_email').value || '').trim();
    const senha = document.getElementById('ipt_senha').value || '';

    if (!email || !senha) {
      alert('Preencha email e senha');
      return;
    }

    try {
      const res = await fetch('/usuarios/autenticar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ emailServer: email, senhaServer: senha })
      });

      if (res.status === 200) {
        const usuario = await res.json();
        // Salva sessão conforme o restante da app espera
        sessionStorage.EMAIL_USUARIO = usuario.email;
        sessionStorage.NOME_USUARIO = usuario.nome;
        sessionStorage.ID_USUARIO = usuario.id;
        sessionStorage.AQUARIOS = JSON.stringify(usuario.vinhedos || []);

        // Mostra mensagem breve e redireciona
        div_login.style.display = 'none';
        div_exibir.style.display = 'flex';
        exibir.innerHTML = `Login realizado com sucesso, ${usuario.nome}!`;
        setTimeout(() => window.location = './dashboard/cards.html', 1000);
        return;
      }

      if (res.status === 403) {
        alert('Email e/ou senha inválido(s)');
        return;
      }

      // outros erros
      const text = await res.text();
      alert('Erro no servidor: ' + res.status + ' - ' + text);
    } catch (err) {
      console.error('Erro ao conectar no servidor:', err);
      alert('Erro ao conectar no servidor: ' + err.message);
    }
  }
</script>

</html>
