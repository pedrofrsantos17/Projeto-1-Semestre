<!DOCTYPE html>
<html lang="pt">
    

<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <title>Cadastro</title>
</head>

<body>
    <div class="card" id="div_cadastro">
        <h2>Cadastro</h2>

        <div class="campo">
            <span class="icone">👤</span>
            <input type="text" id="ipt_nome_usuario" placeholder="Nome de usuário">
        </div>

        <div class="campo">
            <span class="icone">✉️</span>
            <input type="text" id="ipt_email" placeholder="Email">
        </div>

        <div class="campo">
            <span class="icone">🔒</span>
            <input type="password" id="ipt_senha" placeholder="Senha">
        </div>

        <div class="campo">
            <span class="icone">🪪</span>
            <input type="text" id="ipt_cpf" placeholder="CPF(somente números)">


        </div>

        <button onclick="AGA()">Cadastrar</button>
    </div>

    <div class="card" id="div_opcoes" style="display: none;">
        <h2>Empresa</h2>
        <span style="color: #F3EBD3;">Agora, associe-se a uma empresa</span>
        <button onclick="MostrarEntrar()">Entrar em uma empresa</button>
        <button onclick="MostrarCriar()">Criar uma empresa</button>
    </div>

    <div class="card" id="div_entrar" style="display: none;">
        <h2>Entrar</h2>

        <div class="campo">
            <span class="icone">🏢</span>
            <input type="text" id="ipt_codigo_cadastro" placeholder="Código de cadastro da empresa">
        </div>

        <div class="campo">
            <span class="icone">✉️</span>
            <input type="text" id="ipt_email_empresarial" placeholder="Email empresarial">
        </div>

        <button onclick="EntrarEmpresa()">Entrar</button>
    </div>

    <div class="card" id="div_criar" style="display: none;">
        <h2>Cadastrar</h2>

        <div class="campo">
            <span class="icone">🏢</span>
            <input type="text" id="ipt_nome_empresa" placeholder="Nome da empresa">
        </div>

        <div class="campo">
            <span class="icone">📄</span>
            <input type="text" id="ipt_cnpj_empresa" placeholder="CNPJ da empresa">
        </div>

        <div class="campo">
            <span class="icone">✉️</span>
            <input type="text" id="ipt_email_base" placeholder="Base do email (ex: valeverdevinhos.com)">
        </div>

        <button onclick="CriarEmpresa()">Criar empresa</button>
    </div>

    <div class="card" id="div_exibir" style="display: none;">
        <h2>Pronto!</h2>
        <span id="exibir" style="color: #F3EBD3;"></span>
    </div>

<script>
    // Se a página for aberta via file:// a fetch falhará. Avisamos o usuário.
    if (window.location.protocol === 'file:') {
        alert('Abra esta página através do servidor local (ex: http://localhost:3333/cadastroV2.html) e não via file://');
    }
    // Estado temporário do usuário antes de enviar para a API
    let pendingUser = null;

    // passa dos inputs para o objeto pendingUser e abre opções
    function AGA() {
        const nome = (document.getElementById('ipt_nome_usuario').value || '').trim();
        const email = (document.getElementById('ipt_email').value || '').trim();
        const senha = document.getElementById('ipt_senha').value || '';
        const cpf = (document.getElementById('ipt_cpf').value || '').replace(/\D/g, '');

        if (!nome || !email || !senha || !cpf) {
            alert('Preencha nome, email, senha e CPF');
            return;
        }

        pendingUser = {
            nomeServer: nome,
            emailServer: email,
            senhaServer: senha,
            cpfServer: cpf
        };

        document.getElementById('div_cadastro').style.display = 'none';
        document.getElementById('div_opcoes').style.display = 'flex';
    }

    function MostrarEntrar() {
        document.getElementById('div_opcoes').style.display = 'none';
        document.getElementById('div_entrar').style.display = 'flex';
        document.getElementById('div_criar').style.display = 'none';
    }

    function MostrarCriar() {
        document.getElementById('div_opcoes').style.display = 'none';
        document.getElementById('div_criar').style.display = 'flex';
        document.getElementById('div_entrar').style.display = 'none';
    }

    async function EntrarEmpresa() {
        if (!pendingUser) return alert('Preencha primeiro os dados do usuário.');

        const codigo = (document.getElementById('ipt_codigo_cadastro').value || '').trim();
        const emailEmp = (document.getElementById('ipt_email_empresarial').value || '').trim();

        if (!codigo || !emailEmp) return alert('Preencha o código da empresa e o email empresarial');

        // opcional: checar domínio do emailEmp contra o próprio email informado
        if (!emailEmp.includes('@')) return alert('Email empresarial inválido');

        const payload = {
            ...pendingUser,
            codigoCadastroServer: codigo
        };

        try {
            const btn = event && event.target ? event.target : null;
            if (btn) btn.disabled = true;

            const res = await fetch('/usuarios/cadastrar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.status === 200) {
                // após criar o usuário, auto-login
                await doLoginAndRedirect(pendingUser.emailServer, pendingUser.senhaServer);
            } else if (res.status === 404) {
                const txt = await res.text();
                alert(txt || 'Código de cadastro da empresa não encontrado');
            } else if (res.status === 409) {
                const txt = await res.text();
                alert(txt || 'Email ou CPF já cadastrado');
            } else {
                const txt = await res.text();
                alert('Erro: ' + res.status + ' - ' + txt);
            }
        } catch (err) {
            console.error(err);
            alert('Erro na conexão: ' + err.message);
        } finally {
            if (event && event.target) event.target.disabled = false;
        }
    }

    async function CriarEmpresa() {
        if (!pendingUser) return alert('Preencha primeiro os dados do usuário.');

        const nomeEmpresa = (document.getElementById('ipt_nome_empresa').value || '').trim();
        const cnpj = (document.getElementById('ipt_cnpj_empresa').value || '').trim();
        const emailBase = (document.getElementById('ipt_email_base').value || '').trim();

        if (!nomeEmpresa || !cnpj || !emailBase) return alert('Preencha nome, CNPJ e a base do email da empresa');

        try {
            // Chama endpoint único que cria empresa e usuário em sequência (/registro)
            const registroPayload = {
                nomeServer: pendingUser.nomeServer,
                emailServer: pendingUser.emailServer,
                senhaServer: pendingUser.senhaServer,
                cpfServer: pendingUser.cpfServer,
                nomeEmpresaServer: nomeEmpresa,
                cnpjEmpresaServer: cnpj,
                areaServer: null
            };

            const res = await fetch('/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(registroPayload)
            });

            if (res.status === 200) {
                const usuario = await res.json();
                // já retorna o usuário autenticado no formato esperado
                sessionStorage.EMAIL_USUARIO = usuario.email;
                sessionStorage.NOME_USUARIO = usuario.nome;
                sessionStorage.ID_USUARIO = usuario.id;
                sessionStorage.AQUARIOS = JSON.stringify(usuario.vinhedos || []);

                document.getElementById('div_opcoes').style.display = 'none';
                document.getElementById('div_exibir').style.display = 'flex';
                document.getElementById('exibir').innerHTML = `Empresa e usuário criados com sucesso, ${usuario.nome}!`;
                setTimeout(() => window.location = './dashboard/cards.html', 1000);
            } else if (res.status === 409) {
                const txt = await res.text();
                alert(txt || 'Esse CNPJ já está cadastrado');
            } else {
                const txt = await res.text();
                alert('Erro ao criar empresa/usuário: ' + res.status + ' - ' + txt);
            }
        } catch (err) {
            console.error(err);
            alert('Erro na conexão: ' + err.message);
        }
    }

    async function doLoginAndRedirect(email, senha) {
        try {
            const res = await fetch('/usuarios/autenticar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ emailServer: email, senhaServer: senha })
            });

            if (res.status === 200) {
                const usuario = await res.json();
                sessionStorage.EMAIL_USUARIO = usuario.email;
                sessionStorage.NOME_USUARIO = usuario.nome;
                sessionStorage.ID_USUARIO = usuario.id;
                sessionStorage.AQUARIOS = JSON.stringify(usuario.vinhedos || []);

                document.getElementById('div_opcoes').style.display = 'none';
                document.getElementById('div_exibir').style.display = 'flex';
                document.getElementById('exibir').innerHTML = `Cadastro e login efetuados com sucesso, ${usuario.nome}!`;
                setTimeout(() => window.location = './dashboard/cards.html', 1000);
            } else {
                const txt = await res.text();
                alert('Usuário criado, mas falha ao autenticar: ' + res.status + ' - ' + txt);
            }
        } catch (err) {
            console.error(err);
            alert('Erro ao autenticar: ' + err.message);
        }
    }

</script>

</html>
