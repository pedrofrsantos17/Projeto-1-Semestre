<!DOCTYPE html>
<html lang="pt">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  <title>Login</title>
</head>

<body>
<div class="card" id="div_login">
  <h2>Login</h2>

  <div class="campo">
    <span class="icone">👤</span>
    <input type="text" id="ipt_email" placeholder="Email">
  </div>

  <div class="campo">
    <span class="icone">🔒</span>
    <input type="password" id="ipt_senha" placeholder="Senha">
  </div>
  <button onclick="entrar()">Entrar</button>

</div>

<div class="card" id="div_exibir" style="display: none;">
  <h2>Bem-vindo!</h2>
  <span id="exibir" style="color: #F3EBD3;"></span>
</div>
</body>

<script>
  function entrar() {
    let email = ipt_email.value;
    let senha = ipt_senha.value;

    if (email == "" || senha == "") {
      alert(`Preencha email e senha`);
      return;
    }

    fetch("http://localhost:3333/usuarios/autenticar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ emailServer: email, senhaServer: senha })
    })
      .then(function (resposta) {
        if (resposta.ok) {
          resposta.json().then(function (json) {
            sessionStorage.ID_USUARIO = json.id;
            sessionStorage.NOME_USUARIO = json.nome;
            sessionStorage.EMAIL_USUARIO = json.email;
            sessionStorage.ID_EMPRESA = json.empresaId;
            sessionStorage.VINHEDOS = JSON.stringify(json.vinhedos);

            div_login.style.display = "none";
            div_exibir.style.display = "flex";
            exibir.innerHTML = `Login realizado com sucesso, ${json.nome}!`;
            // depois: window.location = "../Dashboard_Geral_Sensor2/dashboard.html";
          });
        } else {
          resposta.text().then(function (texto) {
            alert(texto);
          });
        }
      })
      .catch(function (erro) {
        console.log(erro);
        alert("Não foi possível falar com a API. Ela está rodando?");
      });
  }
</script>

</html>
